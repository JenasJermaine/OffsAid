services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: offsaid
      POSTGRES_PASSWORD: offsaid
      POSTGRES_DB: offsaid
    ports:
      - "5432:5432"
    volumes:
      - offsaid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offsaid -d offsaid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  offsaid_pgdata:
